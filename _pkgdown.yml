url: https://cttir.github.io/segmantR/

template:
  includes:
    in_header: |
      <meta name="theme-color" content="#1565c0">
      <script defer data-domain="cttir.github.io/segmantr" src="https://analytics.hellebo.de/js/script.file-downloads.outbound-links.js"></script>
  package: themakR

development:
  mode: auto

reference:
  - title: Images
    desc: Create, read and inspect images, and synthetic example data.
    contents:
      - new_sg_image
      - sg_read_image
      - sg_read_window
      - sg_read_field
      - sg_read_fields
      - sg_read_envi
      - sg_envi_info
      - sg_image_channels
      - sg_select_channel
      - sg_display_levels
      - sg_display_range
      - sg_slide_display_ranges
      - sg_example_image
      - sg_example_mask
  - title: Preprocessing
    desc: Normalisation, filtering and stain separation before segmentation.
    contents:
      - sg_preprocess
      - sg_stain_deconvolve
  - title: Segmentation
    desc: Classical methods that run in R alone and optional deep learning backends.
    contents:
      - sg_segment_threshold
      - sg_segment_watershed
      - sg_segment_propagate
      - sg_segment_cellpose
      - sg_segment_stardist
      - sg_segment_mesmer
      - sg_setup_python
  - title: Masks and post-processing
    desc: Label masks, their clean-up, export and review status.
    contents:
      - new_sg_mask
      - sg_cleanup_labels
      - sg_filter_cells
      - sg_merge_masks
      - sg_mask_to_polygons
      - sg_export_mask
      - sg_mask_legend
      - sg_mask_review
      - sg_mask_revision
      - sg_mask_status
  - title: Features and evaluation
    desc: Per-cell measurements and agreement with a reference segmentation.
    contents:
      - sg_extract_features
      - sg_evaluate_segmentation
  - title: Visualisation
    desc: Figures of images, masks, features and metrics as ggplot2 objects.
    contents:
      - starts_with("sg_plot_")
  - title: Human-in-the-loop training
    desc: Annotation tasks, corrections, training data, models and model bundles.
    contents:
      - sg_create_annotation_task
      - sg_apply_corrections
      - sg_active_learning_loop
      - sg_prepare_training_data
      - sg_dataset_manifest
      - sg_validate_training_manifest
      - sg_train_cellpose
      - sg_train_stardist
      - new_sg_trained_model
      - sg_predict_model
      - sg_load_model
      - sg_package_model
      - sg_model_card
  - title: Protocols
    desc: Versioned declarative segmentation protocols and their runs.
    contents:
      - starts_with("sg_protocol_")
  - title: Interchange and QuPath
    desc: The neutral interchange format, asset inventories, QuPath programs and the StarDist adapter.
    contents:
      - sg_export_interchange
      - sg_import_interchange
      - sg_validate_interchange
      - sg_interchange_manifest
      - sg_interchange_capabilities
      - sg_hash_assets
      - sg_export_qupath
      - sg_import_qupath
      - sg_stardist_capabilities
      - sg_stardist_manifest
      - sg_stardist_parameter_map
  - title: Regions of interest
    desc: Construct and measure individual ROIs.
    contents:
      - sg_roi
      - has_concept("rois")
  - title: ROI geometry
    desc: Set operations, predicates, transformations and geometry checks.
    contents:
      - has_concept("geometry")
  - title: ROI layers and projects
    desc: Group ROIs into styled layers and projects bound to an image frame.
    contents:
      - sg_roi_frame
      - sg_roi_dims
      - has_concept("layers")
      - has_concept("projects")
  - title: ROI masks
    desc: Rasterise ROIs to binary, labelled and multiclass masks.
    contents:
      - has_concept("masks")
  - title: ROI import and export
    desc: GeoJSON and QuPath files.
    contents:
      - sg_roi_read_geojson
      - sg_roi_read_qupath
      - sg_roi_write_geojson
      - sg_roi_write_qupath
  - title: Shiny application and canvas
    desc: The interactive correction application and its drawing widget.
    contents:
      - sg_app
      - sg_run_app
      - sg_control_capabilities
      - sg_canvas
      - sg_canvas_correct
      - sgCanvasOutput
  - title: Package
    desc: Package overview.
    contents:
      - segmantR-package

articles:
  - title: Get started
    navbar: ~
    contents:
      - segmantR
  - title: Reproducibility and exchange
    navbar: Reproducibility and exchange
    contents:
      - protocols-and-interop
